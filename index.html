<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEX | تسجيل الدخول المركزي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .glass-card {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-[#07090e] text-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="glass-card w-full max-w-md p-8 rounded-3xl shadow-2xl space-y-8">
        
        <!-- Header Info -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-black text-2xl shadow-lg shadow-blue-500/30 mb-4">
                V
            </div>
            <h1 class="text-2xl font-black text-white">تسجيل الدخول إلى VEX</h1>
            <p class="text-xs text-gray-400">اختر طريقة المصادقة المفضلة لديك للوصول إلى النظام</p>
        </div>

        <!-- Auth Buttons Stacked -->
        <div class="space-y-4">
            
            <!-- Google Login Button -->
            <button onclick="handleLogin('Google')" class="w-full flex items-center justify-center gap-3 px-6 py-3.5 rounded-xl bg-white text-gray-900 font-bold hover:bg-gray-100 transition-all duration-300 shadow-md">
                <i class="fa-brands fa-google text-red-500 text-lg"></i>
                <span>المتابعة بواسطة Google</span>
            </button>

            <!-- Apple Login Button -->
            <button onclick="handleLogin('Apple')" class="w-full flex items-center justify-center gap-3 px-6 py-3.5 rounded-xl bg-black text-white font-bold hover:bg-gray-900 transition-all duration-300 border border-gray-800 shadow-md">
                <i class="fa-brands fa-apple text-white text-xl"></i>
                <span>المتابعة بواسطة Apple</span>
            </button>

            <!-- Facebook Login Button -->
            <button onclick="handleLogin('Facebook')" class="w-full flex items-center justify-center gap-3 px-6 py-3.5 rounded-xl bg-[#1877F2] text-white font-bold hover:bg-[#1565c0] transition-all duration-300 shadow-md">
                <i class="fa-brands fa-facebook text-white text-xl"></i>
                <span>المتابعة بواسطة Facebook</span>
            </button>

        </div>

        <div class="text-center">
            <p class="text-[11px] text-gray-500">منصة VEX الآمنة محمية بموثوقية عالية وسيرفرات متزامنة.</p>
        </div>

    </div>

    <script>
        function handleLogin(provider) {
            alert(`جاري الاتصال مع بوابة ${provider} للمصادقة الآمنة...`);
            // هون بينربط الـ API الخاص بكل زر اللي بنيناه سابقاً
        }
    </script>
</body>
</html>
